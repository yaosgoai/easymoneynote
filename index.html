<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#333333">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="輕鬆記帳">
<meta name="referrer" content="no-referrer">
<title>輕鬆記帳 EasyMoneyNote</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<!--
  EasyMoneyNote 的 GitHub Pages 外殼：只負責「好記的網址、主畫面圖示、條碼掃描頁」，
  記帳畫面與所有資料都在 Google Apps Script（白名單登入）裡，本頁不含任何帳務資料或金鑰。
  本檔由 scripts/deploy.ps1 產生，https://script.google.com/macros/s/AKfycbx8KgGmgJaiqgrW9OypDOvav6LGYIea36GGuETY9w4dthewLe6uj0m_EitEl-DZ_rjm/exec 會換成 GAS Web App 網址。
-->
<style>
  html,body{margin:0;height:100%;background:#f6f6f6;font-family:-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#f6f6f6}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#666;background:#f6f6f6;z-index:2;transition:opacity .25s}
  #splash img{width:88px;height:88px;border-radius:20px;box-shadow:0 4px 14px rgba(243,154,30,.35)}
  #splash .t{font-size:22px;font-weight:800;color:#333;letter-spacing:1px}#splash .t b{color:#f39a1e}
  #splash .s{font-size:14px}
  #splash .spin{width:22px;height:22px;border:3px solid #ddd;border-top-color:#f39a1e;border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #fallback{display:none;text-align:center;max-width:320px;line-height:1.6;font-size:14px;color:#666}
  #fallback a{display:inline-block;margin-top:12px;background:linear-gradient(#f7b03a,#f39a1e);color:#fff;text-decoration:none;font-size:18px;padding:12px 30px;border-radius:12px;box-shadow:0 3px 8px rgba(243,154,30,.4)}
  .hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="splash">
  <img src="icon-192.png" alt="">
  <div class="t">輕鬆<b>記帳</b></div>
  <div class="spin" id="spin"></div>
  <div class="s" id="msg">載入中…</div>
  <div id="fallback">
    畫面沒有出現？請先在這個瀏覽器登入你的 Google 帳號，再重新載入。<br>
    （Safari／無痕視窗若封鎖第三方 Cookie，也可能無法在此顯示）<br>
    <a href="https://accounts.google.com/" target="_blank" rel="noopener">登入 Google</a>
    <a href="#" id="retry" style="background:#888;margin-left:8px">重新載入</a>
  </div>
</div>
<div id="hint" style="display:none;position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:3;background:rgba(51,51,51,.92);color:#fff;font-size:13px;padding:8px 12px;border-radius:10px;max-width:92vw;text-align:center">
  載入較慢或畫面空白？<a href="#" onclick="location.reload();return false" style="color:#f7b03a">重新載入</a>
  <a href="#" onclick="this.parentNode.style.display='none';return false" style="color:#ccc;margin-left:6px">✕</a>
</div>
<!-- sandbox 刻意不給 allow-top-navigation：Google 在框內偵測不到登入（瀏覽器封鎖第三方 Cookie）時，
     會把整個分頁跳到 script.google.com，造成畫面切來切去。不給這個權限就跳不出去。 -->
<iframe id="app" title="輕鬆記帳" allow="camera; microphone; geolocation; clipboard-write; fullscreen"
  sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads allow-storage-access-by-user-activation"></iframe>
<script>
(function () {
  'use strict';
  var WEB_URL = 'https://script.google.com/macros/s/AKfycbx8KgGmgJaiqgrW9OypDOvav6LGYIea36GGuETY9w4dthewLe6uj0m_EitEl-DZ_rjm/exec';
  var q = new URLSearchParams(location.search);
  var view = q.get('view') === 'admin' ? 'admin' : '';
  function src(v) {
    var u = WEB_URL + '?wrap=1';
    if (v === 'admin') u += '&view=admin';
    if (q.get('scan') === '1') u += '&scan=1';
    return u;
  }
  var frame = document.getElementById('app');
  var splash = document.getElementById('splash');
  document.getElementById('retry').onclick = function (e) { e.preventDefault(); location.reload(); };
  frame.src = src(view);

  var ready = false, timer = null;
  function startTimer() {
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (ready) return;
      // 沒收到載入完成訊號：先把遮罩拿掉讓 iframe 直接顯示（多數情況其實已載入），
      // 並在畫面上留一個不擋操作的說明。不會跳轉到 Google Apps Script 網址。
      splash.classList.add('hide');
      document.getElementById('hint').style.display = 'block';
    }, 10000);
  }
  startTimer();

  // 只接受 GAS 頁面（script.googleusercontent.com）送來的訊息；內容只有畫面切換指令，沒有資料
  window.addEventListener('message', function (e) {
    // GAS 沙箱網域形如 https://n-xxxx-0lu-script.googleusercontent.com
    if (!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin) &&
        !/^https:\/\/script\.google\.com$/.test(e.origin)) return;
    var d = e.data || {};
    // 登入 token 存在本頁（github.io 第一方儲存），只回傳給發問的 GAS 頁面
    if (d.emn === 'token-get') {
      var t = null;
      try { t = localStorage.getItem('emn_token') || sessionStorage.getItem('emn_token'); } catch (x) {}
      try { e.source.postMessage({ emn: 'token', token: t }, e.origin); } catch (x) {}
      return;
    }
    if (d.emn === 'token-set' && typeof d.token === 'string') {
      try {
        localStorage.removeItem('emn_token'); sessionStorage.removeItem('emn_token');
        (d.remember ? localStorage : sessionStorage).setItem('emn_token', d.token);
      } catch (x) {}
      return;
    }
    if (d.emn === 'token-clear') {
      try { localStorage.removeItem('emn_token'); sessionStorage.removeItem('emn_token'); } catch (x) {}
      return;
    }
    if (d.emn === 'ready') {
      ready = true; clearTimeout(timer);
      splash.classList.add('hide');
      document.getElementById('hint').style.display = 'none';
    } else if (d.emn === 'view' && (d.view === 'admin' || d.view === 'ledger')) {
      view = d.view === 'admin' ? 'admin' : '';
      history.replaceState(null, '', view ? '?view=admin' : location.pathname);
      splash.classList.remove('hide'); ready = false; startTimer();
      frame.src = src(view);
    }
  });
})();
</script>
</body>
</html>

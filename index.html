<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#333333">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="輕鬆記帳">
<meta name="referrer" content="no-referrer">
<title>輕鬆記帳 EasyMoneyNote</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<!--
  EasyMoneyNote 的 GitHub Pages 外殼：只負責「好記的網址、主畫面圖示、條碼掃描頁」，
  記帳畫面與所有資料都在 Google Apps Script（白名單登入）裡，本頁不含任何帳務資料或金鑰。
  本檔由 scripts/deploy.ps1 產生，https://script.google.com/macros/s/AKfycbx8KgGmgJaiqgrW9OypDOvav6LGYIea36GGuETY9w4dthewLe6uj0m_EitEl-DZ_rjm/exec 會換成 GAS Web App 網址。
-->
<style>
  html,body{margin:0;height:100%;background:#f6f6f6;font-family:-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#f6f6f6}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#666;background:#f6f6f6;z-index:2;transition:opacity .25s}
  #splash img{width:88px;height:88px;border-radius:20px;box-shadow:0 4px 14px rgba(243,154,30,.35)}
  #splash .t{font-size:22px;font-weight:800;color:#333;letter-spacing:1px}#splash .t b{color:#f39a1e}
  #splash .s{font-size:14px}
  #splash .spin{width:22px;height:22px;border:3px solid #ddd;border-top-color:#f39a1e;border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #fallback{display:none;text-align:center;max-width:320px;line-height:1.6;font-size:14px;color:#666}
  #fallback a{display:inline-block;margin-top:12px;background:linear-gradient(#f7b03a,#f39a1e);color:#fff;text-decoration:none;font-size:18px;padding:12px 30px;border-radius:12px;box-shadow:0 3px 8px rgba(243,154,30,.4)}
  .hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="splash">
  <img src="icon-192.png" alt="">
  <div class="t">輕鬆<b>記帳</b></div>
  <div class="spin" id="spin"></div>
  <div class="s" id="msg">載入中…</div>
  <div id="fallback">
    畫面沒有出現？可能是還沒登入 Google，或瀏覽器擋住了嵌入頁面的登入狀態（例如 Safari、無痕視窗）。<br>
    <a id="direct" href="#" target="_top">直接開啟記帳</a>
  </div>
</div>
<iframe id="app" title="輕鬆記帳" allow="camera; microphone; geolocation; clipboard-write; fullscreen"></iframe>
<script>
(function () {
  'use strict';
  var WEB_URL = 'https://script.google.com/macros/s/AKfycbx8KgGmgJaiqgrW9OypDOvav6LGYIea36GGuETY9w4dthewLe6uj0m_EitEl-DZ_rjm/exec';
  var q = new URLSearchParams(location.search);
  var view = q.get('view') === 'admin' ? 'admin' : '';
  function src(v) {
    var u = WEB_URL + '?wrap=1';
    if (v === 'admin') u += '&view=admin';
    if (q.get('scan') === '1') u += '&scan=1';
    return u;
  }
  var frame = document.getElementById('app');
  var splash = document.getElementById('splash');
  document.getElementById('direct').href = WEB_URL + (view === 'admin' ? '?view=admin' : '');
  frame.src = src(view);

  var ready = false, timer = null;
  function startTimer() {
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (ready) return;
      document.getElementById('spin').style.display = 'none';
      document.getElementById('msg').style.display = 'none';
      document.getElementById('fallback').style.display = 'block';
    }, 15000);
  }
  startTimer();

  // 只接受 GAS 頁面（script.googleusercontent.com）送來的訊息；內容只有畫面切換指令，沒有資料
  window.addEventListener('message', function (e) {
    if (!/^https:\/\/[a-z0-9-]+\.script\.googleusercontent\.com$/.test(e.origin) &&
        !/^https:\/\/script\.google(usercontent)?\.com$/.test(e.origin)) return;
    var d = e.data || {};
    if (d.emn === 'ready') {
      ready = true; clearTimeout(timer);
      splash.classList.add('hide');
    } else if (d.emn === 'view' && (d.view === 'admin' || d.view === 'ledger')) {
      view = d.view === 'admin' ? 'admin' : '';
      history.replaceState(null, '', view ? '?view=admin' : location.pathname);
      document.getElementById('direct').href = WEB_URL + (view ? '?view=admin' : '');
      splash.classList.remove('hide'); ready = false; startTimer();
      frame.src = src(view);
    }
  });
})();
</script>
</body>
</html>
